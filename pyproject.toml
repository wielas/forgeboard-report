[project]
name = "forgeboard-report"
version = "0.1.0"
description = "A Forge-managed project."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    # lefthook is a dev DEPENDENCY, not an assumed global. Without it here,
    # `make setup` cannot install the git hooks and ADR-0003's entire local
    # enforcement tier is prose (see docs/audit-2026-07-27.md F8).
    "lefthook>=2",
    "pytest>=8",
    "pytest-bdd>=7",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeboard_report"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
